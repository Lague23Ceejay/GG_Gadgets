openapi: 3.0.3
info:
  title: GG Gadgets API
  version: 1.0.0
  description: >
    Backend API for GG Gadgets — a transactional system with products,
    categories, customers, orders, inventory, and user management.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Products
    description: Product management
  - name: Categories
    description: Category management
  - name: Customers
    description: Customer management
  - name: Orders
    description: Order processing
  - name: Order Items
    description: Order item operations
  - name: Inventory
    description: Inventory logs and stock adjustments
  - name: Users
    description: User management

security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      security: []   # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
              required:
                - username
                - password
      responses:
        '201':
          description: User registered successfully

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and receive JWT token
      security: []   # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /products:
    get:
      tags:
        - Products
      summary: Get all products
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Products
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{product_id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

    put:
      tags:
        - Products
      summary: Update product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

    delete:
      tags:
        - Products
      summary: Delete product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      tags:
        - Categories
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /categories/{category_id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

    put:
      tags:
        - Categories
      summary: Update category
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

    delete:
      tags:
        - Categories
      summary: Delete category
      parameters:
        - in: path
          name: category_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category deleted
  /customers:
    get:
      tags:
        - Customers
      summary: Get all customers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

    post:
      tags:
        - Customers
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get customer by ID
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

    put:
      tags:
        - Customers
      summary: Update customer
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

    delete:
      tags:
        - Customers
      summary: Delete customer
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer deleted
  /orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

    post:
      tags:
        - Orders
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{order_id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

    delete:
      tags:
        - Orders
      summary: Delete order
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order deleted

  /orders/{order_id}/status:
    put:
      tags:
        - Orders
      summary: Update order status
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/items:
    post:
      tags:
        - Order Items
      summary: Add an item to an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemCreate'
      responses:
        '201':
          description: Order item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItem'

  /orders/items/{order_item_id}:
    delete:
      tags:
        - Order Items
      summary: Delete an item from an order
      parameters:
        - in: path
          name: order_item_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order item deleted
  /inventory:
    get:
      tags:
        - Inventory
      summary: Get all inventory logs
      responses:
        '200':
          description: List of inventory logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryLog'

    post:
      tags:
        - Inventory
      summary: Add an inventory log entry (restock, adjustment, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLogCreate'
      responses:
        '201':
          description: Inventory log created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLog'

  /inventory/{product_id}/logs:
    get:
      tags:
        - Inventory
      summary: Get inventory logs for a specific product
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inventory logs for product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryLog'
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - Users
      summary: Delete user
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ============================
    # PRODUCTS
    # ============================
    Product:
      type: object
      properties:
        product_id:
          type: integer
        name:
          type: string
        category_id:
          type: integer
        price:
          type: number
        stock:
          type: integer
        created_at:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required:
        - name
        - category_id
        - price
        - stock
      properties:
        name:
          type: string
        category_id:
          type: integer
        price:
          type: number
        stock:
          type: integer

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        category_id:
          type: integer
        price:
          type: number
        stock:
          type: integer

    # ============================
    # CATEGORIES
    # ============================
    Category:
      type: object
      properties:
        category_id:
          type: integer
        name:
          type: string

    CategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string

    # ============================
    # CUSTOMERS
    # ============================
    Customer:
      type: object
      properties:
        customer_id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    # ============================
    # ORDERS
    # ============================
    Order:
      type: object
      properties:
        order_id:
          type: integer
        customer_id:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderCreate:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              quantity:
                type: integer
            required:
              - product_id
              - quantity

    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    # ============================
    # ORDER ITEMS
    # ============================
    OrderItem:
      type: object
      properties:
        order_item_id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer

    OrderItemCreate:
      type: object
      required:
        - order_id
        - product_id
        - quantity
      properties:
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer

    # ============================
    # INVENTORY
    # ============================
    InventoryLog:
      type: object
      properties:
        log_id:
          type: integer
        product_id:
          type: integer
        change:
          type: integer
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    InventoryLogCreate:
      type: object
      required:
        - product_id
        - change
        - reason
      properties:
        product_id:
          type: integer
        change:
          type: integer
        reason:
          type: string

    # ============================
    # USERS
    # ============================
    User:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        role:
          type: string
